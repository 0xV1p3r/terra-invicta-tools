name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri code generation requires frontendDist to exist; no assets are needed by tests.
      - run: mkdir -p apps/tech-tree/build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests requiring real game data skip themselves when data/ is absent.
      - run: cargo test --workspace
      - run: cargo test -p ti-tech-tree export_bindings
      - run: git diff --exit-code -- apps/tech-tree/src/lib/generated

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tech-tree
    steps:
      - uses: actions/checkout@v4
      # Reads the exact pnpm version from packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tech-tree/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/tech-tree/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  extractor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
