[package]
name = "ti-tech-tree"
version = "0.1.0"
description = "Desktop tools for Terra Invicta: research tree, wiki and solar system map"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ti_tech_tree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
percent-encoding = "2"
ti-data = { path = "../../../crates/ti-data" }
ti-extract = { path = "../../../crates/ti-extract" }
tauri-plugin-dialog = "2"

[dev-dependencies]
ts-rs = "11"
