name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      # The app crate embeds the frontend build; an empty folder is enough to compile it.
      - run: mkdir -p apps/tech-tree/build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests that need game data skip: CI has no copy of the game.
      - run: cargo test --workspace
      - name: Check generated TypeScript bindings
        run: |
          cargo test -p ti-tech-tree export_bindings
          git diff --exit-code -- apps/tech-tree/src/lib/generated

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tech-tree
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: apps/tech-tree/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/tech-tree/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  # Fails when .github/workflows/actions.lock is out of sync with the workflows,
  # or a locked commit no longer belongs to its tag. Regenerate it with `gh actions-lock`.
  actions-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
